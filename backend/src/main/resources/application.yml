server:
  port: 8080

spring:
  application:
    name: zhenling-drama
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    # 开启驼峰命名自动映射（数据库 snake_case -> Java camelCase）
    map-underscore-to-camel-case: true
    # SQL 日志输出到控制台（生产环境建议改为 slf4j 或关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # ID 类型为雪花算法生成（分布式 ID）
      id-type: assign_id
      # 逻辑删除字段名
      logic-delete-field: deleted
      # 逻辑删除值（删除时设为 1）
      logic-delete-value: 1
      # 未删除值
      logic-not-delete-value: 0
  # MyBatis Mapper XML 文件路径
  mapper-locations: classpath*:/mapper/**/*.xml

# ====== 文件存储配置 ======
file:
  upload:
    # 文件上传存储路径（相对于项目根目录）
    path: ./data/storage
    # 单个文件最大大小
    max-size: 100MB
  static:
    # 静态资源访问路径
    path: /static
    # 静态资源 URL 前缀
    url-prefix: /static

# ====== OSS 对象存储配置 ======
oss:
  # 是否启用 OSS（false 则使用本地存储）
  enabled: false
  # 云服务商：aliyun / qcloud / huawei / minio
  provider: aliyun
  # OSS 区域节点地址
  endpoint: http://oss-cn-chengdu.aliyuncs.com
  # AccessKey ID（建议使用环境变量而非明文）
  access-key-id: ${OSS_ACCESS_KEY_ID}
  # AccessKey Secret（建议使用环境变量而非明文）
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  # OSS 存储桶名称
  bucket-name: avater2025
  # 自定义域名（可选，留空则使用 endpoint）
  custom-domain:
  # 文件存储的基础路径
  base-path: drama-assets

# ====== CORS 跨域配置 ======
cors:
  # 允许访问的源地址（前端开发/生产地址）
  allowed-origins: http://localhost:5173,http://localhost:3013,http://172.16.100.2:5173,http://172.16.100.2:3013

# ====== AI 服务默认提供商配置 ======
ai:
  # 文本生成默认提供商：openai / minimax / doubao
  default-text-provider: openai
  # 图片生成默认提供商：openai / minimax / doubao
  default-image-provider: openai
  # 视频生成默认提供商：minimax / doubao
  default-video-provider: minimax
  # TTS 语音合成默认提供商：minimax / doubao / openai
  default-tts-provider: minimax

# ====== FFmpeg 配置 ======
ffmpeg:
  # FFmpeg 可执行文件路径（留空则使用系统 PATH 中的 ffmpeg）
  # Windows 开发环境请在 application-dev.yml 中指定完整路径
  # Linux/生产环境通常已安装到系统 PATH，保持空即可
  path: ""
  # ffprobe 可执行文件路径（留空则使用系统 PATH 中的 ffprobe）
  probe-path: ""

# ====== 字幕渲染配置 ======
subtitle:
  # 字体文件绝对路径（优先级最高，指定后忽略 font-name）
  # Windows: C:/Windows/Fonts/msyh.ttc
  # Linux: /usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc
  # Mac: /System/Library/Fonts/PingFang.ttc
  # 留空则使用下面的 font-name 系统字体回退
  font-file: ""
  # 回退字体名称（font-file 为空时使用）
  font-name: "Microsoft YaHei"
  # 字号（基于1080p分辨率）
  font-size: 28
  # 字幕位置: bottom(底部) / top(顶部) / center(居中)
  position: bottom
  # 主色: 白色 (ASS BGR+Alpha格式)
  primary-color: "&H00FFFFFF"
  # 描边色: 深灰色
  outline-color: "&H000000FF"
  # 背景色: 半透明黑色60%
  back-color: "&H80000000"
  # 描边宽度(像素)
  outline-width: 2
  # 阴影深度(像素)
  shadow-depth: 2
  # 底部边距(像素)
  margin-v: 40

# ====== Redis 缓存配置 ======
redis:
  # Redis Key 前缀（区分不同业务）
  key-prefix: drama
  # Token 存储 Key 前缀
  token-prefix: token
  # 缓存数据 Key 前缀
  cache-prefix: cache
