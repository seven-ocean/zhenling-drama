server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/zhenling_drama?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: zhenling_drama
    password: ${MYSQL_PASSWORD:zhenling_drama}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: DramaHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      password: ''
      database: 0
      lettuce:
        pool:
          min-idle: 2
          max-idle: 10
          max-active: 20
          max-wait: 5000

logging:
  level:
    root: INFO
    com.drama: DEBUG

# ====== HTTP 代理配置（开发环境）======
# 两种模式二选一：
# 1. 直连 + 自定义 DNS（推荐，无需代理软件）
# 2. HTTP 代理（如果直连失败，配置 proxy 走代理软件）
http:
  proxy:
    enabled: false      # 直连模式；如需代理改为 true
    host: 127.0.0.1
    port: 8888
  timeout:
    connect: 15000      # 连接超时 15s
    read: 60000         # 读取超时 60s（图片/视频生成耗时较长）
  dns:
    enabled: true      # 开启自定义 DNS 解析
    servers: 8.8.8.8,8.8.4.4  # Google Public DNS

# ====== FFmpeg 配置（开发环境 - Windows）======
# ffmpeg:
#   path: "/usr/bin/ffmpeg"
#   probe-path: "/usr/bin/ffprobe"

# ====== FFmpeg 配置（开发环境 - linux）======
ffmpeg:
  path: "/usr/bin/ffmpeg"
  probe-path: "/usr/bin/ffprobe"